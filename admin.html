<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Quiz answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@450;560;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1714;
    --muted: #6f675f;
    --line: rgba(26, 23, 20, 0.08);
    --paper: #f7f3ee;
    --card: #fffdfb;
    --navy: #1d2a3a;
    --green: #1f7a45;
    --green-bg: #e7f6ec;
    --red: #b4232f;
    --red-bg: #fdecee;
    --amber: #8a5a12;
    --amber-bg: #fff4dc;
    --purple: #6b3fa0;
    --purple-bg: #f1e9fb;
    --orange: #b35a00;
    --orange-bg: #fff0e0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100%;
    font-family: Outfit, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 280px at 100% -40px, #ffe7c2 0%, transparent 55%),
      radial-gradient(700px 240px at -10% 0%, #d7ebe3 0%, transparent 50%),
      var(--paper);
    color: var(--ink);
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .shell { width: min(100%, 520px); margin: 0 auto; }
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .eyebrow {
    margin: 0 0 2px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: Fraunces, Georgia, serif;
    font-size: 34px;
    font-weight: 560;
    letter-spacing: -0.04em;
    line-height: 0.95;
  }
  .refresh {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 8px 24px rgba(26, 23, 20, 0.05);
  }
  .refresh svg { display: block; margin: 0 auto; }
  .sheet, .visit {
    background: var(--card);
    border: 1px solid rgba(26, 23, 20, 0.06);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(61, 42, 20, 0.05);
  }
  .sheet { padding: 6px 8px; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .stat {
    padding: 14px 12px 12px;
    min-width: 0;
  }
  .stat:nth-child(odd) { border-right: 1px solid var(--line); }
  .stat:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
  .stat b {
    display: block;
    font-family: Fraunces, Georgia, serif;
    font-size: 32px;
    font-weight: 560;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .stat span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 560;
  }
  .filters {
    display: flex;
    gap: 4px;
    margin: 14px 0;
    padding: 4px;
    background: rgba(26, 23, 20, 0.05);
    border-radius: 16px;
  }
  .filters button {
    flex: 1;
    min-height: 42px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 15px;
    font-weight: 700;
  }
  .filters button[aria-pressed="true"] {
    background: var(--navy);
    color: #fff;
    box-shadow: 0 6px 16px rgba(29, 42, 58, 0.22);
  }
  .filters.ranges button {
    font-size: 13px;
    padding: 0 2px;
    white-space: nowrap;
  }
  .filters + .filters { margin-top: 0; }
  #filters { flex-wrap: wrap; }
  #filters button { flex: 1 1 calc(25% - 4px); font-size: 14px; }
  .report { padding: 4px 6px 8px; margin-bottom: 12px; }
  .leadline {
    margin: 0;
    padding: 12px 8px 2px;
    font-size: 15px;
    font-weight: 700;
  }
  .block { padding: 14px 8px 12px; }
  .block + .block { border-top: 1px solid var(--line); }
  .kicker {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ask {
    margin: 4px 0 0;
    font-size: 15px;
    font-weight: 560;
    line-height: 1.3;
  }
  .nums {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    margin-top: 12px;
  }
  .nums.two { grid-template-columns: 1fr 1fr; }
  .nums > div { min-width: 0; padding: 0 8px; }
  .nums > div + div { border-left: 1px solid var(--line); }
  .nums b {
    display: block;
    font-family: Fraunces, Georgia, serif;
    font-size: 28px;
    font-weight: 560;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .nums span {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  .nums small {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 560;
  }
  .nums .yes b { color: var(--green); }
  .nums .no b { color: var(--red); }
  .nums.good b { color: var(--green); }
  .nums.bad b { color: var(--red); }
  .nums.debt b { color: var(--purple); }
  .nums.sleep b { color: var(--orange); }
  .bar {
    display: flex;
    height: 8px;
    margin: 12px 8px 0;
    border-radius: 99px;
    overflow: hidden;
    background: #efeae4;
  }
  .bar i { display: block; height: 100%; }
  .bar .yes { background: var(--green); }
  .bar .no { background: var(--red); }
  .bar .none { background: #ddd4ca; }
  .status {
    margin: 28px 8px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    font-weight: 560;
  }
  .visit {
    position: relative;
    overflow: hidden;
    margin-bottom: 12px;
    padding: 16px 16px 14px;
  }
  .visit::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    background: #d8d2ca;
  }
  .visit.qualified::before { background: var(--green); }
  .visit.disqualified::before { background: var(--red); }
  .visit.progress::before { background: #e0a100; }
  .visit.debt::before { background: var(--purple); }
  .visit.sleep::before { background: var(--orange); }
  .visit-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding-left: 6px;
  }
  .clock {
    margin: 0;
    font-family: Fraunces, Georgia, serif;
    font-size: 36px;
    font-weight: 560;
    letter-spacing: -0.045em;
    line-height: 0.9;
  }
  .clock span {
    margin-left: 4px;
    font-family: Outfit, sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .when {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 560;
  }
  .where {
    margin: 3px 0 0;
    color: var(--ink);
    font-size: 13px;
    font-weight: 560;
  }
  .tags { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .sample {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .page {
    flex: 0 0 auto;
    border-radius: 999px;
    background: #f3eee8;
    color: var(--navy);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 7px 10px;
  }
  .qa { margin: 14px 0 0; padding-left: 6px; }
  .qa-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-top: 1px solid var(--line);
  }
  .q {
    min-width: 0;
    font-size: 15px;
    font-weight: 560;
    line-height: 1.25;
  }
  .ans {
    min-width: 64px;
    text-align: center;
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .ans.yes { background: var(--green-bg); color: var(--green); }
  .ans.no { background: var(--red-bg); color: var(--red); }
  .ans.wait { background: #f3eee8; color: var(--muted); }
  .result {
    margin: 12px 0 0 6px;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 700;
  }
  .result.qualified { background: var(--green-bg); color: var(--green); }
  .result.disqualified { background: var(--red-bg); color: var(--red); }
  .result.progress { background: var(--amber-bg); color: var(--amber); }
  .result.debt { background: var(--purple-bg); color: var(--purple); }
  .result.sleep { background: var(--orange-bg); color: var(--orange); }
  h2 {
    margin: 22px 4px 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .combo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid rgba(26, 23, 20, 0.06);
    border-radius: 16px;
    font-size: 14px;
    font-weight: 560;
  }
  .filters.metrics {
    margin: 8px 2px 4px;
    flex-wrap: wrap;
  }
  .filters.metrics button {
    flex: 1 1 auto;
    min-height: 36px;
    padding: 0 10px;
    font-size: 13px;
    white-space: nowrap;
  }
  .chart { padding: 6px 4px 0; }
  .chart svg { display: block; width: 100%; height: auto; }
  .compare {
    margin: 0;
    padding: 10px 8px 2px;
    font-size: 14px;
    font-weight: 560;
    color: var(--muted);
  }
  .compare b { color: var(--ink); font-weight: 700; }
  .delta { font-weight: 700; }
  .delta.up { color: var(--green); }
  .delta.down { color: var(--red); }
  .money {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 6px;
  }
  .money > div { padding: 12px 8px; min-width: 0; }
  .money > div:nth-child(odd) { border-right: 1px solid var(--line); }
  .money > div:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
  .money b {
    display: block;
    font-family: Fraunces, Georgia, serif;
    font-size: 26px;
    font-weight: 560;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .money span {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  .money .pos b, .camp .pos { color: var(--green); }
  .money .neg b, .camp .neg { color: var(--red); }
  .camps { margin-top: 8px; }
  .camp {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 11px 8px;
    border-top: 1px solid var(--line);
  }
  .camp-name { font-size: 14px; font-weight: 700; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
  .camp-meta { margin-top: 3px; font-size: 12px; font-weight: 560; color: var(--muted); }
  .camp-profit { font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 560; letter-spacing: -0.03em; }
  .note { margin: 8px 8px 4px; font-size: 12px; font-weight: 560; color: var(--muted); }
  .combo b {
    font-family: Fraunces, Georgia, serif;
    font-size: 22px;
    font-weight: 560;
  }
</style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div>
      <p class="eyebrow">US Eastern</p>
      <h1>Answers</h1>
    </div>
    <button class="refresh" id="refresh" type="button" aria-label="Refresh">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.2-5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 4v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>
  <p class="status" id="status">Loading answers…</p>
  <div id="app" hidden>
    <div class="filters ranges" id="ranges" role="group" aria-label="Date range, US Eastern">
      <button type="button" data-range="today" aria-pressed="true">Today</button>
      <button type="button" data-range="yesterday" aria-pressed="false">Yesterday</button>
      <button type="button" data-range="7" aria-pressed="false">7 days</button>
      <button type="button" data-range="14" aria-pressed="false">14 days</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Page">
      <button type="button" data-page="all" aria-pressed="true">All</button>
      <button type="button" data-page="glo2" aria-pressed="false">glo2</button>
      <button type="button" data-page="glo2b" aria-pressed="false">glo2b</button>
      <button type="button" data-page="glo3b" aria-pressed="false">glo3b</button>
      <button type="button" data-page="glo4b" aria-pressed="false">glo4b</button>
      <button type="button" data-page="glo5" aria-pressed="false">glo5</button>
      <button type="button" data-page="tobe" aria-pressed="false">tobe</button>
      <button type="button" data-page="abc" aria-pressed="false">abc</button>
    </div>
    <section class="sheet report" id="questions" aria-label="Question rates"></section>
    <section class="sheet report" id="outcomes" aria-label="Result rates"></section>
    <h2>Day by day</h2>
    <section class="sheet report" aria-label="Day by day stats">
      <div class="filters metrics" id="metrics" role="group" aria-label="Metric"></div>
      <div id="trend"></div>
    </section>
    <h2>Campaign profit</h2>
    <section class="sheet report" aria-label="Campaign profit">
      <div class="filters metrics" id="scopes" role="group" aria-label="Campaigns">
        <button type="button" data-scope="glo" aria-pressed="true">GLO campaigns</button>
        <button type="button" data-scope="all" aria-pressed="false">All campaigns</button>
      </div>
      <div id="profit"><p class="status">Loading profit from Pulse…</p></div>
    </section>
    <h2>Visits</h2>
    <div id="list"></div>
  </div>
</div>
<script>
(function () {
  var data = null;
  var filter = "all";
  var range = "today";
  var zone = "America/New_York";
  var periods = { today: "Today", yesterday: "Yesterday", "7": "Last 7 days", "14": "Last 14 days" };
  var debtPages = { glo2: true, glo2b: true, glo3b: true, glo4b: true, glo5: true };
  var q3Fallback = "Do you have over $8k in credit card debt?";
  var metric = "visitors";
  var scope = "glo";
  var profitData = null;
  var profitError = false;
  var weekday = new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "short" });
  var clockFormat = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "numeric", hourCycle: "h23" });
  var metricDefs = [
    { id: "visitors", label: "Visitors", count: function () { return true; } },
    { id: "qualified", label: "Congrats", count: function (e) { return saw(e, "qualifyReached", "qualified"); } },
    { id: "debt", label: "Debt relief", debt: true, count: function (e) { return saw(e, "debtReached", "debt"); } },
    { id: "sleep", label: "Sleep study", debt: true, count: function (e) { return saw(e, "sleepReached", "sleep"); } },
    { id: "disqualified", label: "Disqualified", old: true, count: function (e) { return saw(e, "disqualifyReached", "disqualified"); } },
    { id: "clicks", label: "Clicked", count: function (e) { return Boolean(e.qualifyClick || e.disqualifyClick || e.debtClick || e.sleepClick); } }
  ];

  function parts(iso) {
    var bits = new Intl.DateTimeFormat("en-US", {
      timeZone: zone,
      hour: "numeric",
      minute: "2-digit",
      hour12: true,
      weekday: "short",
      month: "short",
      day: "numeric",
      timeZoneName: "short"
    }).formatToParts(new Date(iso));
    var get = function (type) {
      var found = bits.find(function (part) { return part.type === type; });
      return found ? found.value : "";
    };
    return {
      time: get("hour") + ":" + get("minute"),
      ampm: get("dayPeriod"),
      zone: get("timeZoneName") || "ET",
      day: get("weekday") + ", " + get("month") + " " + get("day")
    };
  }

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"]/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
    });
  }

  function dayKey(iso) {
    var date = new Date(iso);
    if (isNaN(date.getTime())) return "";
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: zone,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(date);
  }

  function shiftKey(key, days) {
    var bits = key.split("-");
    var utc = new Date(Date.UTC(Number(bits[0]), Number(bits[1]) - 1, Number(bits[2]) + days));
    var month = String(utc.getUTCMonth() + 1);
    var day = String(utc.getUTCDate());
    if (month.length < 2) month = "0" + month;
    if (day.length < 2) day = "0" + day;
    return utc.getUTCFullYear() + "-" + month + "-" + day;
  }

  function inRange(iso) {
    var key = dayKey(iso);
    if (!key) return false;
    var today = dayKey(new Date().toISOString());
    if (range === "today") return key === today;
    if (range === "yesterday") return key === shiftKey(today, -1);
    var start = range === "7" ? shiftKey(today, -6) : shiftKey(today, -13);
    return key >= start && key <= today;
  }

  function saw(event, flag, resultName) {
    if (event[flag] === true) return true;
    if (event[flag] === false) return false;
    return event.result === resultName;
  }

  function answer(value) {
    if (value === "yes") return '<span class="ans yes">YES</span>';
    if (value === "no") return '<span class="ans no">NO</span>';
    return '<span class="ans wait">—</span>';
  }

  function resultBlock(event) {
    if (saw(event, "qualifyReached", "qualified")) {
      return '<div class="result qualified">Congratulations' + (event.qualifyClick ? " · button clicked" : "") + "</div>";
    }
    if (saw(event, "debtReached", "debt")) {
      return '<div class="result debt">Debt relief' + (event.debtClick ? " · button clicked" : "") + "</div>";
    }
    if (saw(event, "sleepReached", "sleep")) {
      return '<div class="result sleep">Sleep study' + (event.sleepClick ? " · button clicked" : "") + "</div>";
    }
    if (saw(event, "disqualifyReached", "disqualified")) {
      return '<div class="result disqualified">Disqualification' + (event.disqualifyClick ? " · button clicked" : "") + "</div>";
    }
    if (!event.q1) return '<div class="result progress">Opened the page</div>';
    return '<div class="result progress">Still on question 1</div>';
  }

  function tone(event) {
    if (saw(event, "qualifyReached", "qualified")) return "qualified";
    if (saw(event, "debtReached", "debt")) return "debt";
    if (saw(event, "sleepReached", "sleep")) return "sleep";
    if (saw(event, "disqualifyReached", "disqualified")) return "disqualified";
    return "progress";
  }

  function pct(count, total) {
    if (!total) return "0%";
    return Math.round((count / total) * 100) + "%";
  }

  function share(count, total) {
    if (!total) return "0";
    return count + " of " + total;
  }

  function width(count, total) {
    if (!total || !count) return "0%";
    return (count / total * 100) + "%";
  }

  function cell(cls, count, label, total) {
    return '<div class="' + cls + '"><b>' + pct(count, total) + "</b><span>" + label + "</span><small>" + share(count, total) + "</small></div>";
  }

  function questionBlock(title, ask, yes, no, none, total) {
    return '<div class="block"><p class="kicker">' + title + '</p><p class="ask">' + esc(ask) + "</p>" +
      '<div class="nums">' + cell("yes", yes, "Yes", total) + cell("no", no, "No", total) + cell("", none, "No answer", total) + "</div>" +
      '<div class="bar" aria-hidden="true"><i class="yes" style="width:' + width(yes, total) + '"></i><i class="no" style="width:' + width(no, total) + '"></i><i class="none" style="width:' + width(none, total) + '"></i></div></div>';
  }

  function outcomeBlock(title, reached, clicked, total, toneName) {
    return '<div class="block"><p class="kicker">' + title + '</p><div class="nums two ' + toneName + '">' +
      cell("", reached, "Reached", total) + cell("", clicked, "Button clicked", total) + "</div></div>";
  }

  function chartDays() {
    var today = dayKey(new Date().toISOString());
    var count = range === "14" ? 14 : 7;
    var focus = range === "yesterday" ? shiftKey(today, -1) : today;
    var keys = [];
    for (var i = count - 1; i >= 0; i--) keys.push(shiftKey(today, -i));
    return { today: today, keys: keys, focus: focus, before: shiftKey(focus, -1) };
  }

  function rangeKeys() {
    var days = chartDays();
    if (range === "today" || range === "yesterday") return [days.focus];
    return days.keys;
  }

  function dayLabel(key) {
    var bits = key.split("-");
    var date = new Date(Date.UTC(Number(bits[0]), Number(bits[1]) - 1, Number(bits[2])));
    return { week: weekday.format(date), day: String(Number(bits[2])) };
  }

  function barChart(keys, values, focus, format, signed) {
    var W = 480, H = 210, top = 24, bottom = 44, side = 4;
    var nums = values.filter(function (v) { return v != null; });
    var max = Math.max.apply(null, [0].concat(nums));
    var min = Math.min.apply(null, [0].concat(nums));
    if (max === min) max = min + 1;
    var plot = H - top - bottom;
    var y = function (v) { return top + (max - v) / (max - min) * plot; };
    var slot = (W - side * 2) / keys.length;
    var bw = Math.min(30, slot * 0.6);
    var font = keys.length > 7 ? 10 : 12;
    var y0 = y(0);
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Day by day chart">' +
      '<line x1="' + side + '" x2="' + (W - side) + '" y1="' + y0 + '" y2="' + y0 + '" stroke="#e4ddd5" stroke-width="1"/>';
    keys.forEach(function (key, i) {
      var cx = side + slot * i + slot / 2;
      var v = values[i];
      var on = key === focus;
      var ink = on ? "#1a1714" : "#6f675f";
      var weight = on ? 700 : 560;
      var label = dayLabel(key);
      if (v == null) {
        out += '<text x="' + cx + '" y="' + (y0 - 6) + '" text-anchor="middle" font-size="' + font + '" fill="#6f675f">…</text>';
      } else {
        var h = Math.max(Math.abs(y0 - y(v)), 2);
        var color = signed ? (v < 0 ? "#b4232f" : "#1f7a45") : "#1d2a3a";
        out += '<rect x="' + (cx - bw / 2) + '" y="' + (v < 0 ? y0 : y0 - h) + '" width="' + bw + '" height="' + h + '" rx="4" fill="' + color + '" opacity="' + (on ? 1 : 0.35) + '"/>' +
          '<text x="' + cx + '" y="' + (v < 0 ? y0 + h + font + 2 : y0 - h - 6) + '" text-anchor="middle" font-size="' + font + '" font-weight="700" fill="' + ink + '">' + esc(format(v)) + "</text>";
      }
      out += '<text x="' + cx + '" y="' + (H - 22) + '" text-anchor="middle" font-size="' + font + '" font-weight="' + weight + '" fill="' + ink + '">' + label.week + "</text>" +
        '<text x="' + cx + '" y="' + (H - 7) + '" text-anchor="middle" font-size="' + font + '" font-weight="' + weight + '" fill="' + ink + '">' + label.day + "</text>";
    });
    return out + "</svg>";
  }

  function compareLine(aLabel, a, bLabel, b, format, withDelta) {
    var delta = "";
    if (withDelta && a != null && b != null && b !== 0) {
      var change = Math.round((a - b) / Math.abs(b) * 100);
      delta = ' · <span class="delta ' + (change >= 0 ? "up" : "down") + '">' + (change >= 0 ? "▲ " : "▼ ") + Math.abs(change) + "%</span>";
    }
    return '<p class="compare">' + aLabel + " <b>" + (a == null ? "…" : format(a)) + "</b> · " +
      bLabel + " <b>" + (b == null ? "…" : format(b)) + "</b>" + delta + "</p>";
  }

  function minuteOfDay(iso) {
    var bits = clockFormat.formatToParts(new Date(iso));
    var get = function (type) {
      var found = bits.find(function (part) { return part.type === type; });
      return found ? Number(found.value) : 0;
    };
    return get("hour") * 60 + get("minute");
  }

  function renderTrend(showDebt, showOld) {
    var defs = metricDefs.filter(function (def) { return (!def.debt || showDebt) && (!def.old || showOld); });
    if (!defs.some(function (def) { return def.id === metric; })) metric = "visitors";
    var def = defs.filter(function (item) { return item.id === metric; })[0];
    document.getElementById("metrics").innerHTML = defs.map(function (item) {
      return '<button type="button" data-metric="' + item.id + '" aria-pressed="' + (item.id === metric) + '">' + item.label + "</button>";
    }).join("");
    var days = chartDays();
    var isToday = days.focus === days.today;
    var nowIso = new Date().toISOString();
    var cutoff = minuteOfDay(nowIso);
    var counts = {};
    var soFar = 0;
    days.keys.concat(days.before).forEach(function (key) { counts[key] = 0; });
    data.events.forEach(function (event) {
      if (filter !== "all" && event.page !== filter) return;
      var stamp = event.startedAt || event.updatedAt;
      var key = dayKey(stamp);
      if (!(key in counts) || !def.count(event)) return;
      counts[key] += 1;
      if (isToday && key === days.before && minuteOfDay(stamp) <= cutoff) soFar += 1;
    });
    var now = parts(nowIso);
    document.getElementById("trend").innerHTML =
      (isToday
        ? compareLine("Today so far", counts[days.focus], "yesterday by " + now.time + " " + now.ampm, soFar, String, true)
        : compareLine("Yesterday", counts[days.focus], "day before", counts[days.before], String, true)) +
      '<div class="chart">' + barChart(days.keys, days.keys.map(function (key) { return counts[key]; }), days.focus, String, false) + "</div>";
  }

  function money(v) {
    return (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function shortMoney(v) {
    var abs = Math.abs(v);
    var sign = v < 0 ? "-$" : "$";
    if (abs >= 1000) return sign + (abs / 1000).toFixed(abs >= 10000 ? 0 : 1) + "k";
    return sign + Math.round(abs);
  }

  function signClass(v) {
    return v > 0 ? "pos" : v < 0 ? "neg" : "";
  }

  function inScope(row) {
    return scope === "all" || /glo/i.test(row.name);
  }

  function renderProfit() {
    var box = document.getElementById("profit");
    if (!profitData) {
      box.innerHTML = '<p class="status">' + (profitError ? "Could not load profit from Pulse. Tap refresh." : "Loading profit from Pulse…") + "</p>";
      return;
    }
    var byDay = {};
    profitData.days.forEach(function (day) { byDay[day.date] = day; });
    function dayProfit(key) {
      var day = byDay[key];
      if (!day || !day.campaigns) return null;
      return day.campaigns.filter(inScope).reduce(function (sum, row) { return sum + row.profit; }, 0);
    }
    var camps = {};
    rangeKeys().forEach(function (key) {
      var day = byDay[key];
      if (!day || !day.campaigns) return;
      day.campaigns.filter(inScope).forEach(function (row) {
        var c = camps[row.name] || (camps[row.name] = { name: row.name, conversions: 0, revenue: 0, cost: 0, profit: 0 });
        c.conversions += row.conversions;
        c.revenue += row.revenue;
        c.cost += row.cost;
        c.profit += row.profit;
      });
    });
    var list = Object.keys(camps).map(function (name) { return camps[name]; }).sort(function (a, b) { return b.profit - a.profit; });
    var sum = function (field) { return list.reduce(function (total, row) { return total + row[field]; }, 0); };
    var profit = sum("profit"), revenue = sum("revenue"), cost = sum("cost"), conversions = sum("conversions");
    var days = chartDays();
    var todayRow = byDay[days.today];
    var notes = [];
    if (todayRow && todayRow.fetchedAt) notes.push("From Pulse · updated " + parts(todayRow.fetchedAt).time + " " + parts(todayRow.fetchedAt).ampm);
    if (profitData.missing) notes.push(profitData.missing + " of 14 days still loading, tap refresh in a minute");
    else if (profitData.limited) notes.push("Pulse is busy, some days may be a few minutes old");

    box.innerHTML =
      '<div class="money">' +
        '<div class="' + signClass(profit) + '"><b>' + money(profit) + "</b><span>Profit · " + periods[range] + "</span></div>" +
        "<div><b>" + money(revenue) + "</b><span>Revenue · " + conversions + " conv</span></div>" +
        "<div><b>" + money(cost) + "</b><span>Ad spend</span></div>" +
        '<div class="' + signClass(profit) + '"><b>' + (cost ? Math.round(profit / cost * 100) + "%" : "—") + "</b><span>ROI</span></div>" +
      "</div>" +
      (days.focus === days.today
        ? compareLine("Today so far", dayProfit(days.focus), "yesterday full day", dayProfit(days.before), money, false)
        : compareLine("Yesterday", dayProfit(days.focus), "day before", dayProfit(days.before), money, true)) +
      '<div class="chart">' + barChart(days.keys, days.keys.map(dayProfit), days.focus, shortMoney, true) + "</div>" +
      '<div class="camps">' + (list.length ? list.map(function (row) {
        return '<div class="camp"><div><div class="camp-name">' + esc(row.name) + '</div><div class="camp-meta">' +
          row.conversions + " conv · " + money(row.revenue) + " revenue · " + money(row.cost) + " spend</div></div>" +
          '<div class="camp-profit ' + signClass(row.profit) + '">' + money(row.profit) + "</div></div>";
      }).join("") : '<p class="status">No campaign activity in this period.</p>') + "</div>" +
      (notes.length ? '<p class="note">' + notes.join(" · ") + "</p>" : "");
  }

  function loadProfit() {
    profitError = false;
    renderProfit();
    fetch("/api/profit", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("Could not load profit");
        return res.json();
      })
      .then(function (json) {
        profitData = json;
        renderProfit();
      })
      .catch(function () {
        profitError = true;
        renderProfit();
      });
  }

  function render() {
    var questions = data.questions;
    var events = data.events.filter(function (event) {
      if (filter !== "all" && event.page !== filter) return false;
      return inRange(event.startedAt || event.updatedAt);
    });
    var total = events.length;
    var q3Text = questions.q3 || q3Fallback;
    var showDebt = filter === "all" || debtPages[filter];
    var showOld = filter === "all" || !debtPages[filter];
    var q1yes = 0, q1no = 0, q1none = 0, q2yes = 0, q2no = 0, q2none = 0, q3yes = 0, q3no = 0, q3none = 0;
    var qualReached = 0, qualClick = 0, disReached = 0, disClick = 0;
    var debtReached = 0, debtClick = 0, sleepReached = 0, sleepClick = 0;
    events.forEach(function (event) {
      if (event.q1 === "yes") q1yes += 1;
      else if (event.q1 === "no") q1no += 1;
      else q1none += 1;
      if (event.q2 === "yes") q2yes += 1;
      else if (event.q2 === "no") q2no += 1;
      else q2none += 1;
      if (event.q3 === "yes") q3yes += 1;
      else if (event.q3 === "no") q3no += 1;
      else q3none += 1;
      if (saw(event, "qualifyReached", "qualified")) qualReached += 1;
      if (event.qualifyClick) qualClick += 1;
      if (saw(event, "disqualifyReached", "disqualified")) disReached += 1;
      if (event.disqualifyClick) disClick += 1;
      if (saw(event, "debtReached", "debt")) debtReached += 1;
      if (event.debtClick) debtClick += 1;
      if (saw(event, "sleepReached", "sleep")) sleepReached += 1;
      if (event.sleepClick) sleepClick += 1;
    });

    document.getElementById("questions").innerHTML =
      '<p class="leadline">' + periods[range] + " · " + total + (total === 1 ? " visitor" : " visitors") + "</p>" +
      questionBlock("Question 1", questions.q1, q1yes, q1no, q1none, total) +
      questionBlock("Question 2", questions.q2, q2yes, q2no, q2none, total) +
      (showDebt ? questionBlock("Question 3 · glo2 / glo2b / glo3b / glo4b / glo5", q3Text, q3yes, q3no, q3none, total) : "");
    document.getElementById("outcomes").innerHTML =
      outcomeBlock("Congratulations", qualReached, qualClick, total, "good") +
      (showDebt ? outcomeBlock("Debt relief", debtReached, debtClick, total, "debt") : "") +
      (showDebt ? outcomeBlock("Sleep study", sleepReached, sleepClick, total, "sleep") : "") +
      (showOld ? outcomeBlock("Disqualification", disReached, disClick, total, "bad") : "");
    renderTrend(showDebt, showOld);

    var list = document.getElementById("list");
    if (!events.length) {
      list.innerHTML = '<p class="status">No visitors in this period.</p>';
    } else {
      list.innerHTML = events.map(function (event) {
        var when = parts(event.startedAt || event.updatedAt);
        var where = event.ip ? '<p class="where">' + esc(event.ip) + (event.place ? " · " + esc(event.place) : "") + "</p>" : "";
        var sample = event.sample ? '<div class="sample">Sample</div>' : "";
        return '<article class="visit ' + tone(event) + '">' +
          '<div class="visit-top"><div><p class="clock">' + when.time + '<span>' + when.ampm + ' ' + when.zone + '</span></p><p class="when">' + when.day + '</p>' + where + '</div><div class="tags"><div class="page">' + esc(event.page) + '</div>' + sample + '</div></div>' +
          '<div class="qa">' +
            '<div class="qa-row"><div class="q">' + esc(questions.q1) + '</div>' + answer(event.q1) + '</div>' +
            '<div class="qa-row"><div class="q">' + esc(questions.q2) + '</div>' + answer(event.q2) + '</div>' +
            (debtPages[event.page] || event.q3 ? '<div class="qa-row"><div class="q">' + esc(q3Text) + '</div>' + answer(event.q3) + '</div>' : '') +
          '</div>' +
          resultBlock(event) +
        '</article>';
      }).join("");
    }
  }

  function load() {
    var status = document.getElementById("status");
    status.hidden = false;
    status.textContent = "Loading answers…";
    document.getElementById("app").hidden = true;
    fetch("/api/events", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("Could not load answers");
        return res.json();
      })
      .then(function (json) {
        data = json;
        status.hidden = true;
        document.getElementById("app").hidden = false;
        render();
      })
      .catch(function () {
        status.hidden = false;
        status.textContent = "Could not load answers. Tap refresh.";
      });
  }

  document.getElementById("refresh").addEventListener("click", function () {
    load();
    loadProfit();
  });
  document.getElementById("ranges").addEventListener("click", function (event) {
    var btn = event.target.closest("button");
    if (!btn) return;
    range = btn.getAttribute("data-range");
    document.querySelectorAll("#ranges button").forEach(function (item) {
      item.setAttribute("aria-pressed", item === btn ? "true" : "false");
    });
    if (data) render();
    renderProfit();
  });
  document.getElementById("metrics").addEventListener("click", function (event) {
    var btn = event.target.closest("button");
    if (!btn) return;
    metric = btn.getAttribute("data-metric");
    if (data) render();
  });
  document.getElementById("scopes").addEventListener("click", function (event) {
    var btn = event.target.closest("button");
    if (!btn) return;
    scope = btn.getAttribute("data-scope");
    document.querySelectorAll("#scopes button").forEach(function (item) {
      item.setAttribute("aria-pressed", item === btn ? "true" : "false");
    });
    renderProfit();
  });
  document.getElementById("filters").addEventListener("click", function (event) {
    var btn = event.target.closest("button");
    if (!btn) return;
    filter = btn.getAttribute("data-page");
    document.querySelectorAll("#filters button").forEach(function (item) {
      item.setAttribute("aria-pressed", item === btn ? "true" : "false");
    });
    if (data) render();
  });
  load();
  loadProfit();
})();
</script>
</body>
</html>
