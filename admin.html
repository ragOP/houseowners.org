<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Quiz answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@450;560;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1714;
    --muted: #6f675f;
    --line: rgba(26, 23, 20, 0.08);
    --paper: #f7f3ee;
    --card: #fffdfb;
    --navy: #1d2a3a;
    --green: #1f7a45;
    --green-bg: #e7f6ec;
    --red: #b4232f;
    --red-bg: #fdecee;
    --amber: #8a5a12;
    --amber-bg: #fff4dc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100%;
    font-family: Outfit, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 280px at 100% -40px, #ffe7c2 0%, transparent 55%),
      radial-gradient(700px 240px at -10% 0%, #d7ebe3 0%, transparent 50%),
      var(--paper);
    color: var(--ink);
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .shell { width: min(100%, 520px); margin: 0 auto; }
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .eyebrow {
    margin: 0 0 2px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: Fraunces, Georgia, serif;
    font-size: 34px;
    font-weight: 560;
    letter-spacing: -0.04em;
    line-height: 0.95;
  }
  .refresh {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 8px 24px rgba(26, 23, 20, 0.05);
  }
  .refresh svg { display: block; margin: 0 auto; }
  .sheet, .visit {
    background: var(--card);
    border: 1px solid rgba(26, 23, 20, 0.06);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(61, 42, 20, 0.05);
  }
  .sheet { padding: 6px 8px; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .stat {
    padding: 14px 12px 12px;
    min-width: 0;
  }
  .stat:nth-child(odd) { border-right: 1px solid var(--line); }
  .stat:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
  .stat b {
    display: block;
    font-family: Fraunces, Georgia, serif;
    font-size: 32px;
    font-weight: 560;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .stat span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 560;
  }
  .filters {
    display: flex;
    gap: 4px;
    margin: 14px 0;
    padding: 4px;
    background: rgba(26, 23, 20, 0.05);
    border-radius: 16px;
  }
  .filters button {
    flex: 1;
    min-height: 42px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 15px;
    font-weight: 700;
  }
  .filters button[aria-pressed="true"] {
    background: var(--navy);
    color: #fff;
    box-shadow: 0 6px 16px rgba(29, 42, 58, 0.22);
  }
  .status {
    margin: 28px 8px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    font-weight: 560;
  }
  .visit {
    position: relative;
    overflow: hidden;
    margin-bottom: 12px;
    padding: 16px 16px 14px;
  }
  .visit::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    background: #d8d2ca;
  }
  .visit.qualified::before { background: var(--green); }
  .visit.disqualified::before { background: var(--red); }
  .visit.progress::before { background: #e0a100; }
  .visit-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding-left: 6px;
  }
  .clock {
    margin: 0;
    font-family: Fraunces, Georgia, serif;
    font-size: 36px;
    font-weight: 560;
    letter-spacing: -0.045em;
    line-height: 0.9;
  }
  .clock span {
    margin-left: 4px;
    font-family: Outfit, sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .when {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 560;
  }
  .page {
    flex: 0 0 auto;
    border-radius: 999px;
    background: #f3eee8;
    color: var(--navy);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 7px 10px;
  }
  .qa { margin: 14px 0 0; padding-left: 6px; }
  .qa-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-top: 1px solid var(--line);
  }
  .q {
    min-width: 0;
    font-size: 15px;
    font-weight: 560;
    line-height: 1.25;
  }
  .ans {
    min-width: 64px;
    text-align: center;
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .ans.yes { background: var(--green-bg); color: var(--green); }
  .ans.no { background: var(--red-bg); color: var(--red); }
  .ans.wait { background: #f3eee8; color: var(--muted); }
  .result {
    margin: 12px 0 0 6px;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 700;
  }
  .result.qualified { background: var(--green-bg); color: var(--green); }
  .result.disqualified { background: var(--red-bg); color: var(--red); }
  .result.progress { background: var(--amber-bg); color: var(--amber); }
  h2 {
    margin: 22px 4px 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .combo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid rgba(26, 23, 20, 0.06);
    border-radius: 16px;
    font-size: 14px;
    font-weight: 560;
  }
  .combo b {
    font-family: Fraunces, Georgia, serif;
    font-size: 22px;
    font-weight: 560;
  }
</style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div>
      <p class="eyebrow">US Eastern</p>
      <h1>Answers</h1>
    </div>
    <button class="refresh" id="refresh" type="button" aria-label="Refresh">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.2-5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 4v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>
  <p class="status" id="status">Loading answers…</p>
  <div id="app" hidden>
    <section class="sheet" aria-label="Totals">
      <div class="stats" id="stats"></div>
    </section>
    <div class="filters" id="filters">
      <button type="button" data-page="all" aria-pressed="true">All</button>
      <button type="button" data-page="glo2" aria-pressed="false">glo2</button>
      <button type="button" data-page="glo2b" aria-pressed="false">glo2b</button>
    </div>
    <div id="list"></div>
    <h2>Combinations</h2>
    <div id="combos"></div>
  </div>
</div>
<script>
(function () {
  var data = null;
  var filter = "all";
  var zone = "America/New_York";

  function parts(iso) {
    var bits = new Intl.DateTimeFormat("en-US", {
      timeZone: zone,
      hour: "numeric",
      minute: "2-digit",
      hour12: true,
      weekday: "short",
      month: "short",
      day: "numeric",
      timeZoneName: "short"
    }).formatToParts(new Date(iso));
    var get = function (type) {
      var found = bits.find(function (part) { return part.type === type; });
      return found ? found.value : "";
    };
    return {
      time: get("hour") + ":" + get("minute"),
      ampm: get("dayPeriod"),
      zone: get("timeZoneName") || "ET",
      day: get("weekday") + ", " + get("month") + " " + get("day")
    };
  }

  function answer(value) {
    if (value === "yes") return '<span class="ans yes">YES</span>';
    if (value === "no") return '<span class="ans no">NO</span>';
    return '<span class="ans wait">—</span>';
  }

  function resultBlock(result) {
    if (result === "qualified") return '<div class="result qualified">Qualified</div>';
    if (result === "disqualified") return '<div class="result disqualified">Disqualified</div>';
    return '<div class="result progress">Still on question 1</div>';
  }

  function tone(result) {
    if (result === "qualified" || result === "disqualified" || result === "progress") return result;
    return "progress";
  }

  function stat(value, label) {
    return '<div class="stat"><b>' + value + '</b><span>' + label + '</span></div>';
  }

  function render() {
    var summary = data.summary;
    var questions = data.questions;
    document.getElementById("stats").innerHTML = [
      stat(summary.total, "Visitors"),
      stat(summary.byPage.glo2.qualified + summary.byPage.glo2b.qualified, "Qualified"),
      stat(summary.byPage.glo2.total, "glo2"),
      stat(summary.byPage.glo2b.total, "glo2b")
    ].join("");

    var events = data.events.filter(function (event) {
      return filter === "all" || event.page === filter;
    });
    var list = document.getElementById("list");
    if (!events.length) {
      list.innerHTML = '<p class="status">No answers yet.</p>';
    } else {
      list.innerHTML = events.map(function (event) {
        var when = parts(event.updatedAt || event.startedAt);
        return '<article class="visit ' + tone(event.result) + '">' +
          '<div class="visit-top"><div><p class="clock">' + when.time + '<span>' + when.ampm + ' ' + when.zone + '</span></p><p class="when">' + when.day + '</p></div><div class="page">' + event.page + '</div></div>' +
          '<div class="qa">' +
            '<div class="qa-row"><div class="q">' + questions.q1 + '</div>' + answer(event.q1) + '</div>' +
            '<div class="qa-row"><div class="q">' + questions.q2 + '</div>' + answer(event.q2) + '</div>' +
          '</div>' +
          resultBlock(event.result) +
        '</article>';
      }).join("");
    }

    var combos = data.summary.combos.filter(function (row) {
      return filter === "all" || row.page === filter;
    });
    document.getElementById("combos").innerHTML = combos.length ? combos.map(function (row) {
      var label = row.page + " · " + (row.q1 || "—").toUpperCase() + " / " + (row.q2 || "—").toUpperCase();
      return '<div class="combo"><span>' + label + '</span><b>' + row.count + '</b></div>';
    }).join("") : '<p class="status">No combinations yet.</p>';
  }

  function load() {
    var status = document.getElementById("status");
    status.hidden = false;
    status.textContent = "Loading answers…";
    document.getElementById("app").hidden = true;
    fetch("/api/events", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("Could not load answers");
        return res.json();
      })
      .then(function (json) {
        data = json;
        status.hidden = true;
        document.getElementById("app").hidden = false;
        render();
      })
      .catch(function () {
        status.hidden = false;
        status.textContent = "Could not load answers. Tap refresh.";
      });
  }

  document.getElementById("refresh").addEventListener("click", load);
  document.getElementById("filters").addEventListener("click", function (event) {
    var btn = event.target.closest("button");
    if (!btn) return;
    filter = btn.getAttribute("data-page");
    document.querySelectorAll("#filters button").forEach(function (item) {
      item.setAttribute("aria-pressed", item === btn ? "true" : "false");
    });
    if (data) render();
  });
  load();
})();
</script>
</body>
</html>
