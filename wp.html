<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Senior Equity Release Program</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ece5dd;
    color: #111;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: url("images/wp-bg.png") center / cover;
  }
  .top {
    background: #005e54;
    color: #fff;
    padding: 8px 12px 8px 10px;
    padding-top: max(8px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 8px;
    height: 64px;
    flex-shrink: 0;
    z-index: 10;
    overflow: hidden;
  }
  .top img.av { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .top .meta { flex: 1; min-width: 0; overflow: hidden; }
  .top .name {
    display: flex; align-items: center; gap: 4px;
    font-size: 13px; font-weight: 700; line-height: 1.2; min-width: 0;
  }
  @media (max-width: 420px) {
    .top { padding: 8px; gap: 6px; }
    .top img.av { width: 36px; height: 36px; }
    .top .name { font-size: 12px; gap: 3px; }
    .top .status { font-size: 12px; }
    .icons { gap: 10px; }
    .icons svg { width: 18px; height: 18px; }
  }
  @media (max-width: 360px) {
    .top .name { font-size: 9.5px; }
    .top img.av { width: 32px; height: 32px; }
    .opts { padding-left: 8px; }
  }
  .top .name span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .top .name img { width: 16px; height: 16px; flex-shrink: 0; }
  .top .status { font-size: 13px; font-weight: 400; opacity: .95; line-height: 1.2; }
  .icons { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .icons svg { width: 22px; height: 22px; flex-shrink: 0; display: block; fill: none; stroke: #fff; stroke-width: 2; }
  .icons svg.menu { fill: #fff; stroke: none; }
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px 220px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .row { display: flex; position: relative; }
  .row, .typing, .opts { animation: msgIn .5s ease-out; }
  .row.me { animation-name: msgInRight; }
  .cta.show { animation: msgInUp .6s ease-out; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes msgInRight {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes msgInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .thread { scroll-behavior: auto; }
    .row, .typing, .opts, .cta.show { animation: none; }
  }
  .row.bot { justify-content: flex-start; padding-left: 40px; }
  .row.me { justify-content: flex-end; }
  .row.bot .av {
    position: absolute; left: 0; bottom: 0;
    width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
  }
  .bubble {
    max-width: 82%;
    padding: 8px 8px 4px 10px;
    border-radius: 8px;
    font-size: 16px;
    line-height: 1.35;
    box-shadow: 0 1px 1px rgba(0,0,0,.12);
    min-width: 70px;
  }
  .bot .bubble { background: #fff; }
  .me .bubble { background: #dcf8c6; }
  .meta-line {
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
  }
  .meta-line time { font-size: 10px; color: #9ca3af; }
  .meta-line img { width: 16px; height: 16px; }
  .typing { display: flex; align-items: center; gap: 8px; }
  .typing img { width: 32px; height: 32px; border-radius: 50%; }
  .dots {
    background: #fff; border-radius: 8px; padding: 10px 12px;
    display: flex; gap: 4px; box-shadow: 0 1px 1px rgba(0,0,0,.12);
  }
  .dots i {
    width: 8px; height: 8px; border-radius: 50%; background: #6b7280;
    animation: bounce 1s infinite;
  }
  .dots i:nth-child(1) { animation-delay: -0.3s; }
  .dots i:nth-child(2) { animation-delay: -0.15s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(.8, 0, 1, 1); }
    50% { transform: none; animation-timing-function: cubic-bezier(0, 0, .2, 1); }
  }
  .opts {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    width: 100%;
    max-width: 420px;
    padding-left: 40px;
    margin-top: 4px;
  }
  .opts button {
    border: 0; background: #005e54; color: #fff;
    font-family: inherit; font-size: 16px; font-weight: 600;
    padding: 12px 16px; border-radius: 999px; cursor: pointer;
    width: 100%; text-align: center; line-height: 1.25;
  }
  .cta {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 16px 8px 0;
    max-width: 420px;
    width: 100%;
    margin: 0 auto;
  }
  .cta.show { display: flex; }
  .cta .note {
    background: #dcfce7; color: #15803d; text-align: center;
    padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px;
    width: 100%;
  }
  .cta a {
    margin-top: 14px; background: #22c55e; color: #fff;
    text-decoration: none; font-weight: 800;
    font-size: clamp(14px, 4.2vw, 18px);
    padding: 14px 12px; border-radius: 8px; width: 100%;
    text-align: center; line-height: 1.25; white-space: nowrap;
  }
  .cta .amount { margin-top: 6px; color: inherit; font-weight: 600; font-size: 15px; }
  .cta .fine { margin-top: 10px; color: #6b7280; text-align: center; font-size: 12px; }
  .cta .warn { margin-top: 14px; color: #4b5563; text-align: center; font-size: 13px; }
  .cta .timer { margin-top: 8px; color: #ef4444; font-weight: 800; font-size: 18px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img class="av" src="images/wp-agent.png" alt="Agent">
    <div class="meta">
      <div class="name"><span>Senior Equity Release Program</span><img src="images/wp-tick.png" alt=""></div>
      <div class="status">online</div>
    </div>
    <div class="icons" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      <svg class="menu" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </div>
  </header>
  <div class="thread" id="thread"></div>
</div>
<script>
(function () {
  var OFFER = "https://trk.pickwisely.online/click";
  var DEBT = "https://www.nz91nyfbo.com/ZZ2GX/5Q9RM9/?sub1=excludecoe";
  var CREDIT = "tel:xxx-xxx-xxxx";
  var thread = document.getElementById("thread");
  var timerId = null;
  var leadFired = false;

  function timeNow() {
    var d = new Date();
    return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
  }

  function el(html) {
    var d = document.createElement("div");
    d.innerHTML = html.trim();
    return d.firstChild;
  }

  function addMsg(text, sender, last) {
    var row = document.createElement("div");
    row.className = "row " + sender;
    var av = (sender === "bot" && last)
      ? '<img class="av" src="images/wp-agent.png" alt="">'
      : "";
    var ticks = sender === "me"
      ? '<img src="images/wp-delivered.svg" alt="">'
      : "";
    row.innerHTML = av +
      '<div class="bubble">' + text +
      '<span class="meta-line">' + ticks + "<time>" + timeNow() + "</time></span></div>";
    var typing = document.getElementById("typing");
    if (typing) thread.insertBefore(row, typing);
    else thread.appendChild(row);
    scroll();
  }

  function showTyping(on) {
    var old = document.getElementById("typing");
    if (old) old.remove();
    if (!on) return;
    var n = el('<div class="typing" id="typing"><img src="images/wp-agent.png" alt=""><div class="dots"><i></i><i></i><i></i></div></div>');
    thread.appendChild(n);
    scroll();
  }

  function showOpts(opts) {
    clearOpts();
    if (!opts || !opts.length) return;
    var wrap = document.createElement("div");
    wrap.className = "opts";
    wrap.id = "opts";
    opts.forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = o;
      b.addEventListener("click", function () { handle(o); });
      wrap.appendChild(b);
    });
    thread.appendChild(wrap);
    scroll();
  }

  function clearOpts() {
    var o = document.getElementById("opts");
    if (o) o.remove();
  }

  function scroll() {
    requestAnimationFrame(function () {
      thread.scrollTo({ top: thread.scrollHeight, behavior: "smooth" });
    });
  }

  function botQueue(msgs, opts, after) {
    showTyping(true);
    var i = 0;
    function next() {
      if (i >= msgs.length) {
        showTyping(false);
        if (opts) showOpts(opts);
        if (after) after();
        return;
      }
      setTimeout(function () {
        addMsg(msgs[i], "bot", i === msgs.length - 1);
        i += 1;
        next();
      }, 1500);
    }
    next();
  }

  function fireLead(e) {
    if (leadFired) return;
    leadFired = true;
    e.preventDefault();
    var destination = e.currentTarget.href;
    var urlParams = new URLSearchParams(window.location.search);
    var clickid = urlParams.get("rtkcid")
      || urlParams.get("clickid")
      || urlParams.get("subid")
      || (document.cookie.match(/(?:rtkcid|clickid|subid)=([^;]+)/) || [])[1]
      || localStorage.getItem("rtkcid");
    if (clickid) {
      var postbackUrl = "https://trk.pickwisely.online/postback?clickid=" + encodeURIComponent(clickid) + "&type=Lead";
      if (window.fetch) fetch(postbackUrl, { method: "GET", keepalive: true }).catch(function () {});
      else new Image().src = postbackUrl;
    }
    setTimeout(function () { window.location.href = destination; }, 150);
  }

  function startTimer(el, seconds) {
    if (timerId) clearInterval(timerId);
    var t = seconds;
    function tick() {
      var m = Math.floor(t / 60);
      var s = t % 60;
      el.textContent = m + ":" + (s < 10 ? "0" : "") + s;
      if (t > 0) t -= 1;
      else clearInterval(timerId);
    }
    tick();
    timerId = setInterval(tick, 1000);
  }

  function showEligible() {
    var box = el(
      '<div class="cta show">' +
        '<div class="note">Based on Your Homeownership, You May Qualify<div class="amount">Up to $185,000</div></div>' +
        '<p class="warn">Based on your pre-screening responses, you appear to meet the initial eligibility criteria. Complete your full application to see your personalized cash-out amount in 60 seconds.</p>' +
        '<a class="offer" href="' + OFFER + '">View My Personalized Offer →</a>' +
        '<p class="fine">🔒 Secure • No SSN required • Free eligibility check • 60 seconds</p>' +
        '<p class="timer">Your eligibility result expires in <span id="timer">10:00</span></p>' +
      "</div>"
    );
    thread.appendChild(box);
    box.querySelector("a.offer").addEventListener("click", fireLead);
    startTimer(document.getElementById("timer"), 10 * 60);
    scroll();
  }

  function showDebt() {
    var box = el(
      '<div class="cta show">' +
        '<div class="note">You don\'t qualify, but you qualify for a 100% Debt Relief by the gov.</div>' +
        '<p class="warn">Based on your responses we found that you\'re perfectly eligible for the Economic Debt Relief gov. program under which you can get all of your debt eliminated. Click on the button below and apply now, takes under 60 seconds.</p>' +
        '<a class="offer" href="' + DEBT + '">Claim My Debt Relief →</a>' +
        '<p class="fine">🔒 Secure • Free eligibility check • Under 60 seconds</p>' +
      "</div>"
    );
    thread.appendChild(box);
    box.querySelector("a.offer").addEventListener("click", fireLead);
    scroll();
  }

  function showCredit() {
    var box = el(
      '<div class="cta show">' +
        '<div class="note">You don\'t qualify, but you qualify for a Credit Score Boost</div>' +
        '<p class="warn">Based on your responses we found that you\'re perfectly eligible for the Credit Boost Program under which you can get a boost of up to 100s of points. Click on the button below and call the official agent that has been assigned to you right now.</p>' +
        '<a class="offer" href="' + CREDIT + '">CALL xxx-xxx (xxxx) →</a>' +
      "</div>"
    );
    thread.appendChild(box);
    box.querySelector("a.offer").addEventListener("click", fireLead);
    scroll();
  }

  function askHome() {
    botQueue(["Have you owned your home for 5 or more years?"], ["Yes, 5+ years", "Less than 5 years"]);
  }

  function askCredit() {
    botQueue(["How is your credit score?"], [
      "Excellent (Above 800+)",
      "Very Good (740 - 799)",
      "Good (670 - 739)",
      "Fair (580 - 669)",
      "Poor (Below 579)"
    ]);
  }

  function askEquity() {
    botQueue(["How much equity / cash do you need?"], [
      "Under $30,000",
      "$30,000 – $100,000",
      "$100,000 – $200,000",
      "Over $200,000"
    ]);
  }

  function goDqDebt() {
    botQueue(["Do you have over $8k in debt?"], ["YES", "NO"]);
  }

  function goProcessingEligible() {
    showEligible();
  }

  function goProcessingDq() {
    goDqDebt();
  }

  function handle(option) {
    clearOpts();
    var shown = option === "👉 Yes! Show me how to claim!" ? "Yes" : option;
    addMsg(shown, "me", true);

    if (option === "👉 Yes! Show me how to claim!") {
      botQueue([
        "Awesome! Let's get you the benefit ASAP. I just need to ask you a couple of quick questions.",
        "Are you over the age of 65?"
      ], ["Yes, I'm over 65", "No, I'm under 65"]);
    } else if (option === "Yes, I'm over 65") {
      askHome();
    } else if (option === "No, I'm under 65") {
      goProcessingDq();
    } else if (option === "Yes, 5+ years" || option === "Less than 5 years") {
      askCredit();
    } else if (option === "Excellent (Above 800+)" || option === "Very Good (740 - 799)" || option === "Good (670 - 739)") {
      askEquity();
    } else if (option === "Fair (580 - 669)" || option === "Poor (Below 579)") {
      goProcessingDq();
    } else if (option === "Under $30,000") {
      goProcessingDq();
    } else if (option === "$30,000 – $100,000" || option === "$100,000 – $200,000" || option === "Over $200,000") {
      goProcessingEligible();
    } else if (option === "YES") {
      showDebt();
    } else if (option === "NO") {
      botQueue(["Would you like to boost your credit score by 100s of points in one phone call?"], ["Yes, boost my credit", "No thanks"]);
    } else if (option === "Yes, boost my credit") {
      showCredit();
    } else if (option === "No thanks") {
      botQueue([
        "You Do Not Qualify at This Time",
        "Based on your selection, you do not meet the eligibility criteria for this program at this time."
      ]);
    }
  }

  botQueue([
    "Hey there! 👋",
    "Emily this side. Let’s find out if you qualify to cash out up to $185,000 from your home equity — it’s quick and only takes 2 minutes!",
    "Tap 'Yes' to get started! ⬇️"
  ], ["👉 Yes! Show me how to claim!"]);
})();
</script>
</body>
</html>
